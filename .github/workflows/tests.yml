# Runs the free test suite on every push and pull request: no API key, no paid call.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The settings require a key at startup (fail fast in production). CI makes no
      # paid call: a placeholder is enough, and the real-call tests skip themselves.
      ANTHROPIC_API_KEY: sk-test-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: embedding-model-${{ hashFiles('app/config.py') }}

      - name: Build the databases
        run: |
          uv run python scripts/generate_data.py
          uv run python scripts/build_analytics.py

      - name: Run the tests (fake LLM, integration tests skipped)
        run: uv run pytest -v --ignore=tests/test_integration.py
